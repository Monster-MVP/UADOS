[metadata]
name = uados
version = 2.0.0
description = Portable project memory and accountable agent development workflows

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
uados = assets/*.md, assets/*/*.md, assets/.agent/*.md, assets/.cursor/rules/*.md, assets/.cursor/rules/*.mdc

[options.entry_points]
console_scripts =
    uados = uados.cli:main
